name: Release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish release
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Reserve patch version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail

          # Leading zeroes are invalid SemVer and would also make bash evaluate
          # $((PATCH + 1)) as octal, so such tags are ignored.
          first_release_tag() {
            awk '/^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$/ && !found { print; found=1 }'
          }

          while true; do
            git fetch --force --tags origin

            EXISTING_TAG="$(
              git tag --points-at "$RELEASE_SHA" --sort=-version:refname | first_release_tag
            )"

            if [[ -n "$EXISTING_TAG" ]]; then
              if RELEASE_DETAILS="$(
                gh release view "$EXISTING_TAG" --json isDraft,assets 2>/dev/null
              )"; then
                VERSION="${EXISTING_TAG#v}"
                if jq -e \
                  --arg dmg "Tinitch-$VERSION.dmg" \
                  --arg checksum "Tinitch-$VERSION.dmg.sha256" \
                  '.isDraft == false
                    and ([.assets[].name] | index($dmg)) != null
                    and ([.assets[].name] | index($checksum)) != null' \
                  <<< "$RELEASE_DETAILS" >/dev/null; then
                  echo "Commit $RELEASE_SHA was already released as $EXISTING_TAG."
                  echo "should_release=false" >> "$GITHUB_OUTPUT"
                  exit 0
                fi

                echo "Release $EXISTING_TAG is incomplete or still a draft; rebuilding it."
              fi

              RELEASE_TAG="$EXISTING_TAG"
              break
            fi

            LATEST_TAG="$(
              git tag --list 'v*' --sort=-version:refname | first_release_tag
            )"

            if [[ -z "$LATEST_TAG" ]]; then
              RELEASE_TAG="v0.1.0"
            else
              IFS=. read -r MAJOR MINOR PATCH <<< "${LATEST_TAG#v}"
              RELEASE_TAG="v$MAJOR.$MINOR.$((PATCH + 1))"
            fi

            git tag "$RELEASE_TAG" "$RELEASE_SHA"
            if git push origin "refs/tags/$RELEASE_TAG"; then
              break
            fi

            git tag -d "$RELEASE_TAG"
            if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null; then
              echo "Version $RELEASE_TAG was reserved concurrently; retrying."
              sleep 2
              continue
            fi

            echo "Failed to reserve $RELEASE_TAG and no matching remote tag exists." >&2
            exit 1
          done

          echo "Reserved $RELEASE_TAG for $RELEASE_SHA."
          {
            echo "should_release=true"
            echo "tag=$RELEASE_TAG"
            echo "number=${RELEASE_TAG#v}"
          } >> "$GITHUB_OUTPUT"

      - name: Archive app
        if: steps.version.outputs.should_release == 'true'
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          xcodebuild archive \
            -project Tinitch.xcodeproj \
            -scheme Tinitch \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Tinitch.xcarchive" \
            MARKETING_VERSION="$VERSION" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Verify app version
        if: steps.version.outputs.should_release == 'true'
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          INFO_PLIST="$RUNNER_TEMP/Tinitch.xcarchive/Products/Applications/Tinitch.app/Contents/Info.plist"
          ACTUAL_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INFO_PLIST")"
          ACTUAL_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$INFO_PLIST")"
          if [[ "$ACTUAL_VERSION" != "$VERSION" || "$ACTUAL_BUILD" != "$BUILD_NUMBER" ]]; then
            echo "Expected Tinitch $VERSION ($BUILD_NUMBER), but the archive contains $ACTUAL_VERSION ($ACTUAL_BUILD)." >&2
            exit 1
          fi

      - name: Import signing certificate
        if: steps.version.outputs.should_release == 'true'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/tinitch-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
          printf '%s' "$MACOS_CERTIFICATE" | base64 -D > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/certificate.p12" \
            -P "$MACOS_CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          security set-key-partition-list \
            -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Sign app
        if: steps.version.outputs.should_release == 'true'
        env:
          CODESIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/Tinitch.xcarchive/Products/Applications/Tinitch.app"
          codesign \
            --force \
            --sign "$CODESIGN_IDENTITY" \
            --options runtime \
            --timestamp \
            --entitlements Tinitch/Tinitch.entitlements \
            "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Create signed disk image
        if: steps.version.outputs.should_release == 'true'
        env:
          CODESIGN_IDENTITY: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail
          mkdir -p artifacts "$RUNNER_TEMP/Tinitch-dmg"
          ditto "$RUNNER_TEMP/Tinitch.xcarchive/Products/Applications/Tinitch.app" \
            "$RUNNER_TEMP/Tinitch-dmg/Tinitch.app"
          hdiutil create \
            -volname "Tinitch ${VERSION}" \
            -srcfolder "$RUNNER_TEMP/Tinitch-dmg" \
            -ov \
            -format UDZO \
            "artifacts/Tinitch-${VERSION}.dmg"
          codesign \
            --force \
            --sign "$CODESIGN_IDENTITY" \
            --timestamp \
            "artifacts/Tinitch-${VERSION}.dmg"
          codesign --verify --strict --verbose=2 "artifacts/Tinitch-${VERSION}.dmg"

      - name: Notarize and staple disk image
        if: steps.version.outputs.should_release == 'true'
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          set -euo pipefail
          API_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          printf '%s' "$APPLE_API_KEY" | base64 -D > "$API_KEY_PATH"
          xcrun notarytool submit \
            "artifacts/Tinitch-${VERSION}.dmg" \
            --key "$API_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "artifacts/Tinitch-${VERSION}.dmg"
          xcrun stapler validate "artifacts/Tinitch-${VERSION}.dmg"
          spctl --assess \
            --type open \
            --context context:primary-signature \
            --verbose=2 \
            "artifacts/Tinitch-${VERSION}.dmg"
          cd artifacts
          shasum -a 256 "Tinitch-${VERSION}.dmg" > "Tinitch-${VERSION}.dmg.sha256"

      - name: Publish GitHub Release
        if: steps.version.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.number }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "artifacts/Tinitch-${VERSION}.dmg" \
              "artifacts/Tinitch-${VERSION}.dmg.sha256" \
              --clobber
            gh release edit "$RELEASE_TAG" --draft=false
          else
            gh release create "$RELEASE_TAG" \
              "artifacts/Tinitch-${VERSION}.dmg" \
              "artifacts/Tinitch-${VERSION}.dmg.sha256" \
              --verify-tag \
              --generate-notes \
              --title "Tinitch ${VERSION}"
          fi

      - name: Clean up signing material
        if: always() && steps.version.outputs.should_release == 'true'
        run: |
          security delete-keychain "$RUNNER_TEMP/tinitch-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP"/AuthKey_*.p8
