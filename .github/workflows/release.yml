name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish release
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Validate version tag
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Version tag must be SemVer, for example v1.2.3 or v1.2.3-beta.1." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run tests
        run: |
          xcodebuild test \
            -project Tinitch.xcodeproj \
            -scheme Tinitch \
            -destination 'platform=macOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Archive app
        run: |
          xcodebuild archive \
            -project Tinitch.xcodeproj \
            -scheme Tinitch \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Tinitch.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Create disk image
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p artifacts "$RUNNER_TEMP/Tinitch-dmg"
          ditto "$RUNNER_TEMP/Tinitch.xcarchive/Products/Applications/Tinitch.app" \
            "$RUNNER_TEMP/Tinitch-dmg/Tinitch.app"
          hdiutil create \
            -volname "Tinitch ${VERSION}" \
            -srcfolder "$RUNNER_TEMP/Tinitch-dmg" \
            -ov \
            -format UDZO \
            "artifacts/Tinitch-${VERSION}.dmg"
          cd artifacts
          shasum -a 256 "Tinitch-${VERSION}.dmg" > "Tinitch-${VERSION}.dmg.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          if gh release view "$VERSION" >/dev/null 2>&1; then
            gh release upload "$VERSION" \
              "artifacts/Tinitch-${VERSION}.dmg" \
              "artifacts/Tinitch-${VERSION}.dmg.sha256" \
              --clobber
            gh release edit "$VERSION" --draft=false
          else
            gh release create "$VERSION" \
              "artifacts/Tinitch-${VERSION}.dmg" \
              "artifacts/Tinitch-${VERSION}.dmg.sha256" \
              --verify-tag \
              --generate-notes \
              --title "Tinitch ${VERSION}"
          fi
