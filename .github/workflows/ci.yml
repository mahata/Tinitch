name: CI

# A successful CI run on main publishes a release, so changes that cannot affect
# the app are kept out of the push trigger. Pull requests always run the tests.
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - LICENSE
      - .gitignore
      - .github/dependabot.yml
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Build
        run: >
          xcodebuild
          -project Tinitch.xcodeproj
          -scheme Tinitch
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          build

      - name: Test
        run: >
          xcodebuild
          -project Tinitch.xcodeproj
          -scheme Tinitch
          -configuration Debug
          -destination 'platform=macOS'
          CODE_SIGNING_ALLOWED=NO
          test
